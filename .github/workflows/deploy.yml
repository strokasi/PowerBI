- name: Inject Power Automate URL
  env:
    PA_URL: ${{ secrets.POWER_AUTOMATE_URL }}
  run: |
    python3 << 'PYEOF'
    import os

    file_path = '5-znakov.html'

    with open(file_path, 'r') as f:
        content = f.read()

    content = content.replace('POWER_AUTOMATE_URL_PLACEHOLDER', os.environ['PA_URL'])

    with open(file_path, 'w') as f:
        f.write(content)

    print('URL injected successfully')
    PYEOF
