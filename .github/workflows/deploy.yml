name: Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject Power Automate URL
        env:
          PA_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: |
          python3 << 'PYEOF'
          import os

          file_path = 'PowerBI/5-znakov.html'

          with open(file_path, 'r') as f:
              content = f.read()

          content = content.replace('POWER_AUTOMATE_URL_PLACEHOLDER', os.environ['PA_URL'])

          with open(file_path, 'w') as f:
              f.write(content)

          print('URL injected successfully')
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
